[workspace]
name = "mathmodel-code"
version = "0.1.0"
description = "数学建模竞赛机器学习代码模板"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
joblib = ">=1.3"
libblas = { version = "*", build = "*openblas" }
matplotlib = ">=3.7"
numpy = ">=1.24"
openpyxl = ">=3.1"
pandas = ">=2.0"
pyyaml = ">=6.0"
scikit-learn = ">=1.3"
scipy = ">=1.10"

[pypi-dependencies]
mathmodel-code = { path = ".", editable = true, extras = ["dev"] }

[feature.boosting.dependencies]
lightgbm = ">=4"
xgboost = ">=2"
catboost = ">=1.2"

[feature.explain.dependencies]
shap = ">=0.44"

[feature.timeseries.dependencies]
statsmodels = ">=0.14"

[feature.timeseries.pypi-dependencies]
mlforecast = ">=0.13"

[feature.anomaly.pypi-dependencies]
pyod = ">=2"

[feature.tuning.dependencies]
optuna = ">=3.6"

[environments]
default = { solve-group = "default" }
forecast = { features = ["timeseries"], solve-group = "forecast" }
full = { features = ["boosting", "explain", "timeseries", "anomaly", "tuning"], solve-group = "full" }

[tasks]
demo-data = "python examples/make_demo_data.py"
test = "pytest"
lint = "ruff check ."
demo-classification = { cmd = "mathmodel run -c configs/classification.yaml", depends-on = ["demo-data"] }
demo-regression = { cmd = "mathmodel run -c configs/regression.yaml", depends-on = ["demo-data"] }
demo-clustering = { cmd = "mathmodel run -c configs/clustering.yaml", depends-on = ["demo-data"] }
demo-anomaly = { cmd = "mathmodel run -c configs/anomaly.yaml", depends-on = ["demo-data"] }
demo-timeseries = { cmd = "mathmodel run -c configs/timeseries.yaml", depends-on = ["demo-data"] }
demo = { depends-on = ["demo-classification", "demo-regression", "demo-clustering", "demo-anomaly", "demo-timeseries"] }
check = { depends-on = ["lint", "test"] }
template-eda = { cmd = "python grad-ml-template/02_eda/eda.py data/raw/classification.csv --target target", depends-on = ["demo-data"] }
template-baseline = { cmd = "python grad-ml-template/04_model/tabular/baseline.py -c configs/classification.yaml", depends-on = ["demo-data"] }
template-cluster = { cmd = "python grad-ml-template/04_model/clustering/cluster.py data/raw/classification.csv --features feature_0 feature_1 feature_2 --clusters 3", depends-on = ["demo-data"] }
template-pca = { cmd = "python grad-ml-template/03_feature/pca_svd.py data/raw/classification.csv --features feature_0 feature_1 feature_2 feature_3", depends-on = ["demo-data"] }
template-pso = "python grad-ml-template/04_model/optimization/particle_swarm.py --dimensions 2 --particles 15 --iterations 30"
template-preprocess = { cmd = "python grad-ml-template/01_data/scaling.py data/raw/classification.csv --columns feature_0 feature_1 --method logistic --output data/processed/demo_scaled.csv", depends-on = ["demo-data"] }
template-smoke = { depends-on = ["template-eda", "template-preprocess", "template-baseline", "template-cluster", "template-pca", "template-pso"] }
