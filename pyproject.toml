[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodel-code"
version = "0.3.0"
description = "Composable algorithm toolkit for mathematical modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4", "xgboost>=2", "catboost>=1.2"]
explain = ["shap>=0.44"]
timeseries = ["statsmodels>=0.14", "mlforecast>=0.13"]
decomposition = ["statsmodels>=0.14", "EMD-signal>=1.6", "vmdpy>=0.2"]
prophet = ["prophet>=1.1"]
deep-timeseries = ["torch>=2.2"]
anomaly = ["pyod>=2"]
tuning = ["optuna>=3.6"]
vision = ["torch>=2", "torchvision>=0.17", "timm>=1"]
dev = ["pytest>=8", "ruff>=0.5"]
all = [
  "lightgbm>=4", "xgboost>=2", "catboost>=1.2", "shap>=0.44",
  "statsmodels>=0.14", "mlforecast>=0.13", "EMD-signal>=1.6", "vmdpy>=0.2",
  "pyod>=2", "optuna>=3.6",
]

[project.scripts]
mathmodel = "mathmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
